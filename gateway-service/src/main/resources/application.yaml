server:
  port: 8000

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://127.0.0.1:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: member-service
          uri: lb://member-service
          predicates:
            - Path=/api/members/**, /admin/**, /api/admin/**
        - id: stock-service
          uri: lb://stock-service
          predicates:
            - Path=/api/stock/**, /api/orders/**, /orders/**
        - id: point-service
          uri: lb://point-service
          predicates:
            - Path=/api/asset/**, /api/history/**, /history/**
        - id: coupon-service
          uri: lb://coupon-service
          predicates:
            - Path=/api/coupons/**, /coupons/**
        - id: ai-news-service
          uri: lb://ai-news-service
          predicates:
            - Path=/api/ai/**, /api/news/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
