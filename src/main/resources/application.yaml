spring:
  profiles:
    active: dev
  application:
    name: stockGame_spring


  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${DB_URL:jdbc:mariadb://127.0.0.1:3307/mydb?allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:mydbid}
    password: ${DB_PASSWORD:mydbpw}
  jpa:
    open-in-view: false
    generate-ddl: false
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect

jwt:
  secret: ${JWT_SECRET:defaultSecretKeyWithAtLeast32BytesLengthForHmacSha256!}

mybatis:
  mapper-locations: classpath:mappers/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
server:
  port: 8882