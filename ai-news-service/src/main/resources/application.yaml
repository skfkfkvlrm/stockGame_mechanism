server:
  port: 8085

spring:
  application:
    name: ai-news-service
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${DB_URL:jdbc:mariadb://127.0.0.1:3307/mydb?useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:mydbid}
    password: ${DB_PASSWORD:mydbpw}
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: none

jwt:
  secret: ${JWT_SECRET:defaultSecretKeyWithAtLeast32BytesLengthForHmacSha256!}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

